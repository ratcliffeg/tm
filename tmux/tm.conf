# New window running Claude on the personal account (separate config dir) — prefix + P
# (@account is set straight away so the after-new-window hook doesn't colour it as work.)
bind-key P new-window -n personal -c "#{pane_current_path}" -e "CLAUDE_CONFIG_DIR=$HOME/.claude-personal" 'claude --remote-control "P-$(basename "$PWD" | tr "[:lower:]" "[:upper:]" | tr -c "A-Z0-9_\n-" "-")"' \; \
    set-option -w @account personal \; \
    run-shell -b "$HOME/.local/bin/tmux-account-style personal-window '#{window_id}'"

# Colour sessions by Claude account: personal (CLAUDE_CONFIG_DIR=~/.claude-personal) gets a
# blue status bar, PERSONAL label and tint; everything else gets green and WORK. Applies
# wherever a session was started from (tm, tmux-personal, restore).
# Single quotes around the ids: session ids look like $3, which the shell would expand.
set-hook -g session-created "run-shell -b \"$HOME/.local/bin/tmux-account-style session '#{session_id}'\""
set-hook -g after-new-window "run-shell -b \"$HOME/.local/bin/tmux-account-style window '#{window_id}'\""

# 24-bit colour for the account tints. Over SSH the terminal's COLORTERM isn't passed on, so a
# remote tmux (3.4 ignores it even when it is) falls back to 256 colours, and the very dark
# tints round to the same near-black grey. Declaring RGB keeps them. Both lines are quiet: the
# first is for tmux 3.2+, the second for older versions.
set -asq terminal-features ',*:RGB'
set -asq terminal-overrides ',*:Tc'

# Terminal window/tab title: session and machine, e.g. "W-MYPROJECT (myhost)", so you can tell
# which machine a terminal is on without switching to it.
set -g set-titles on
set -g set-titles-string '#S (#{host_short})'
